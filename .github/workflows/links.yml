name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config .lychee.toml
            README.md CONTRIBUTING.md CHANGELOG.md
            .github/ISSUE_TEMPLATE/matrix-correction.md
          fail: true
          failIfEmpty: true
          jobSummary: true
          output: ./lychee/out.md
